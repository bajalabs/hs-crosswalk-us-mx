name: Bug report
description: The builder fails, or a command does not do what the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a wrong code, title, rate or match in the published files, use the data error report instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what it printed.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `python3 -m hs_crosswalk --version`, or the commit.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
      placeholder: Ubuntu 24.04, Python 3.12.8
