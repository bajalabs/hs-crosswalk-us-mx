name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest -v

      - name: Build from the committed fixtures
        run: >-
          python -m hs_crosswalk build
          --us-json tests/fixtures/us/hts_fixture.json
          --us-csv tests/fixtures/us/hts_fixture.csv
          --mx-dir tests/fixtures/mx
          --out "$RUNNER_TEMP/dist"

      - name: Verify the checksums of the build
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum --check SHA256SUMS
